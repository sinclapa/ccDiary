services:
  ccdiaryapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=LocalCompose
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=443
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/${HTTPS_CERT_FILE:-ccdiaryapi.pfx}
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${HTTPS_CERT_PASSWORD}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_SERVICE_NAME=ccDiaryApi
    ports:
      - "5121:8080"
      - "7184:443"
    volumes:
      - type: bind
        source: ${HTTPS_CERTS_PATH}
        target: /home/app/.aspnet/https
        read_only: true
      - type: bind
        source: ${USER_SECRETS_PATH}
        target: /home/app/.microsoft/usersecrets
        read_only: true