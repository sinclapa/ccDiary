# Infra project (cookingcode_ccDiary_infra)
# Covers deploy (Bicep/ARM), scripts (shell), data (SQL), and root PowerShell scripts
# API project uses dotnet sonarscanner CLI args in build-api CI job
# UI project uses sonar-project.properties

# Scan from repo root but limit to infra/script/data files only
sonar.sources=.
sonar.inclusions=deploy/**,scripts/**,data/**,*.ps1
sonar.exclusions=src/**,.github/**,.vs/**,.vscode/**,**/node_modules/**

# Two findings are accepted design decisions, not defects, and are waived here. In-file
# // NOSONAR markers do not work for the azureresourcemanager analyser — they were tried on
# both, and both issues still raised.
#
# S6380 (deploy/functionApp.bicep) — no authsettingsV2 on the site. The platform's built-in
# authentication is deliberately unused: the API validates Entra JWTs itself and then adds the
# role stored against the user in the database, which is the chain every authorization policy
# depends on. Easy Auth would terminate the token before the app ever saw it.
#
# S6329 (deploy/resourceGroup.bicep) — the Key Vault's public endpoint. Nothing here sits in a
# virtual network: the function app resolves its references from the platform's own address
# space, and the infrastructure script writes the secrets from a developer's machine. Access is
# governed by RBAC instead — the app's identity may read secret values and nothing else.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=azureresourcemanager:S6380
sonar.issue.ignore.multicriteria.e1.resourceKey=deploy/functionApp.bicep
sonar.issue.ignore.multicriteria.e2.ruleKey=azureresourcemanager:S6329
sonar.issue.ignore.multicriteria.e2.resourceKey=deploy/resourceGroup.bicep
