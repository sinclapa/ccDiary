# UI project (cookingcode_ccDiary_ui)
# API project uses dotnet sonarscanner CLI args in build-api CI job

# Source and test directories
sonar.sources=src/ui/src
sonar.tests=src/ui/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts

# Coverage reports
sonar.javascript.lcov.reportPaths=src/ui/coverage/lcov.info
sonar.typescript.lcov.reportPaths=src/ui/coverage/lcov.info
