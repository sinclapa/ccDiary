name: Bump and Tag Version
description: Calculates next semver from commit message and pushes a tag.
# The tag is pushed with the workflow's own GITHUB_TOKEN, which actions/checkout persists into
# the git config — the calling job needs `contents: write`. No personal token is involved:
# nothing triggers on a tag push (prod is started by an explicit workflow_dispatch from
# create-release), and no ruleset targets tags, so the built-in token is sufficient.
inputs:
  commit-message:
    description: Commit message used to determine semver bump level.
    required: true
outputs:
  current_version:
    description: Current version before bump.
    value: ${{ steps.bump.outputs.current_version }}
  next_version:
    description: New version that was tagged.
    value: ${{ steps.bump.outputs.next_version }}
runs:
  using: composite
  steps:
    - name: Calculate next semantic version
      id: bump
      shell: bash
      env:
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set -euo pipefail

        git fetch --tags --force

        LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
        if [ -z "${LATEST_TAG}" ]; then
          CURRENT_VERSION="0.0.0"
        else
          CURRENT_VERSION="${LATEST_TAG#v}"
        fi

        if [[ "$COMMIT_MESSAGE" == *"BREAKING CHANGE"* ]] || [[ "$COMMIT_MESSAGE" =~ ^[a-zA-Z]+\(.*\)!: ]] || [[ "$COMMIT_MESSAGE" =~ ^[a-zA-Z]+!: ]]; then
          BUMP="major"
        elif [[ "$COMMIT_MESSAGE" =~ ^feat\(.*\): ]] || [[ "$COMMIT_MESSAGE" =~ ^feat: ]]; then
          BUMP="minor"
        else
          BUMP="patch"
        fi

        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

        case "$BUMP" in
          major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
          patch) PATCH=$((PATCH + 1)) ;;
        esac

        NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"

        echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
        echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

    - name: Create and push tag
      shell: bash
      env:
        NEW_VERSION: ${{ steps.bump.outputs.next_version }}
      run: |
        set -euo pipefail

        TAG="v${NEW_VERSION}"

        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists. Nothing to do."
          exit 0
        fi

        # A lightweight tag carries no tagger identity, so no git user needs configuring.
        git tag "$TAG"

        if ! TAG_PUSH_OUTPUT=$(git push origin "$TAG" 2>&1); then
          echo "$TAG_PUSH_OUTPUT"
          if echo "$TAG_PUSH_OUTPUT" | grep -q "403"; then
            echo "Tag push was denied (403). The calling job needs 'permissions: contents: write', and actions/checkout must keep persist-credentials enabled." >&2
          fi
          if echo "$TAG_PUSH_OUTPUT" | grep -q "GH013"; then
            echo "Tag push blocked by repository rules (GH013). A tag ruleset now covers v* tags; GitHub Actions needs to be a bypass actor on it." >&2
          fi
          exit 1
        fi
