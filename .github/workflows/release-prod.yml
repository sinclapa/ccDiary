on:
  release:
    types: [published]

jobs:
  release-prod:
    environment: prod

    if: startsWith(github.ref_name, 'v')

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Get Artifact from Release
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          version: ${{ github.event.release.id }}
          file: ui-dist.zip

      - name: Get API image tag from Release
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          version: ${{ github.event.release.id }}
          file: api-image.txt

      - name: Unzip Artifact
        run: unzip ui-dist.zip

      - name: Read API image tag
        id: api_image
        run: echo "value=$(tr -d '\n\r' < api-image.txt)" >> $GITHUB_OUTPUT

      - name: "Configure UI (prod)"
        env:
          VITE_API: ${{ secrets.API_URL }}
          VITE_APPLICATION_ID_URI: ${{ secrets.ENTRA_APPLICATION_ID_URI }}
          VITE_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          VITE_TENANT_ID: ${{ secrets.TENANT_ID }}
          VITE_FARO_URL: ${{ secrets.GRAFANA_FARO_URL }}
          VITE_ENVIRONMENT: prod
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const file = './ui-dist/config.js';
          let content = fs.readFileSync(file, 'utf8');
          const keys = ['VITE_API', 'VITE_APPLICATION_ID_URI', 'VITE_CLIENT_ID', 'VITE_TENANT_ID', 'VITE_FARO_URL', 'VITE_ENVIRONMENT'];
          for (const key of keys) {
            const raw = process.env[key] || '';
            const escaped = raw.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
            content = content.replace(new RegExp(`(${key}:\\s*)['"][^'"]*['"]`), (_, prefix) => `${prefix}"${escaped}"`);
          }
          fs.writeFileSync(file, content);
          SCRIPT

      - name: Deploy UI to Prod
        id: builddeploy-prod
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN}}"
          action: "upload"
          app_location: "ui-dist"
          skip_app_build: true
          skip_api_build: true

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy public GHCR image to Container App with migration
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --image ${{ steps.api_image.outputs.value }} \
            --set-env-vars "RUN_MIGRATIONS=true" "OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}" "OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}" "OTEL_SERVICE_NAME=ccDiaryApi" \
            --output none

      - name: Wait for revision to be running
        run: |
          APP_FQDN=$(az containerapp show \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Waking app at https://${APP_FQDN}..."
          curl -s -o /dev/null "https://${APP_FQDN}/actuator/health" || true
          echo "Waiting for new revision to become active..."
          for i in $(seq 1 30); do
            STATUS=$(az containerapp revision list \
              --name ${{ vars.CONTAINER_APP_NAME }} \
              --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
              --query "sort_by([], &properties.createdTime)[-1].properties.runningState" -o tsv 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "Running" ] || [ "$STATUS" = "RunningAtMaxScale" ]; then
              echo "Revision is running ($STATUS)."
              break
            fi
            echo "  Status: $STATUS (attempt $i/30)"
            curl -s -o /dev/null "https://${APP_FQDN}/actuator/health" || true
            sleep 10
          done

      - name: Verify deployment health
        run: |
          APP_FQDN=$(az containerapp show \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Polling https://${APP_FQDN}/actuator/health ..."
          for i in $(seq 1 20); do
            HTTP_STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "https://${APP_FQDN}/actuator/health" || echo "000")
            HEALTH_STATUS=$(jq -r '.status' /tmp/health.json 2>/dev/null || echo "unknown")
            echo "  HTTP $HTTP_STATUS, status: $HEALTH_STATUS (attempt $i/20)"
            if [ "$HTTP_STATUS" = "200" ] && [ "$HEALTH_STATUS" = "UP" ]; then
              echo "Deployment is healthy."
              break
            fi
            if [ "$i" = "20" ]; then
              echo "Health check failed after 20 attempts." >&2
              cat /tmp/health.json >&2
              exit 1
            fi
            sleep 10
          done

      - name: Disable migration for subsequent restarts
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --set-env-vars "RUN_MIGRATIONS=false" \
            --output none
