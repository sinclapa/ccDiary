on:
  release:
    types: [published]

jobs:
  release-prod:
    environment: prod

    if: startsWith(github.ref_name, 'v')

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Get Artifact from Release
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          version: ${{ github.event.release.id }}
          file: ui-dist.zip

      - name: Get API image tag from Release
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          version: ${{ github.event.release.id }}
          file: api-image.txt

      - name: Unzip Artifact
        run: unzip ui-dist.zip

      - name: Read API image tag
        id: api_image
        run: echo "value=$(tr -d '\n\r' < api-image.txt)" >> $GITHUB_OUTPUT

      - name: "Configure UI (prod)"
        env:
          VITE_API: ${{ vars.API_URL }}
          VITE_APPLICATION_ID_URI: ${{ vars.ENTRA_APPLICATION_ID_URI }}
          VITE_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          VITE_TENANT_ID: ${{ vars.TENANT_ID }}
          VITE_FARO_URL: ${{ vars.GRAFANA_FARO_URL }}
          VITE_ENVIRONMENT: prod
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const file = './ui-dist/config.js';
          let content = fs.readFileSync(file, 'utf8');
          const keys = ['VITE_API', 'VITE_APPLICATION_ID_URI', 'VITE_CLIENT_ID', 'VITE_TENANT_ID', 'VITE_FARO_URL', 'VITE_ENVIRONMENT'];
          for (const key of keys) {
            const raw = process.env[key] || '';
            const escaped = raw.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
            content = content.replace(new RegExp(`(${key}:\\s*)['"][^'"]*['"]`), (_, prefix) => `${prefix}"${escaped}"`);
          }
          fs.writeFileSync(file, content);
          SCRIPT

      - name: Deploy UI to Prod
        id: builddeploy-prod
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN}}"
          action: "upload"
          app_location: "ui-dist"
          skip_app_build: true
          skip_api_build: true

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The "wake SQL database" step that used to sit here is gone: storage is always
      # on, so there is no paused resource to resume before deploying.

      - name: Deploy public GHCR image to Container App
        run: |
          ENV_VARS=(
            "Storage__AccountName=${{ vars.STORAGE_ACCOUNT_NAME }}"
            "OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}"
            "OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}"
            "OTEL_SERVICE_NAME=ccDiaryApi"
            "Graph__TenantId=${{ vars.TENANT_ID }}"
            "Graph__ClientId=${{ vars.ENTRA_CLIENT_ID }}"
            "Graph__ClientSecret=${{ secrets.ENTRA_CLIENT_SECRET }}"
            "Graph__InviteRedirectUrl=${{ vars.GRAPH_INVITE_REDIRECT_URL }}"
            "Graph__AppDisplayName=Cooking Code Diary"
            "BootstrapAdmin__ObjectId=${{ vars.BOOTSTRAP_ADMIN_OBJECT_ID }}"
            "BootstrapAdmin__Email=${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}"
            "BootstrapAdmin__DisplayName=${{ vars.BOOTSTRAP_ADMIN_DISPLAY_NAME }}"
            "Smtp__Host=${{ vars.SMTP_HOST }}"
            "Smtp__Port=${{ vars.SMTP_PORT }}"
            "Smtp__Username=${{ vars.SMTP_USERNAME }}"
            "Smtp__Password=${{ secrets.SMTP_PASSWORD }}"
            "Smtp__From=${{ vars.SMTP_FROM }}"
            "Smtp__FromName=${{ vars.SMTP_FROM_NAME }}"
          )
          # Managed identity supplies the credential, so only the account name is passed.
          # Any stale SQL connection string is removed so a later image-only rollback
          # cannot pick it up again.
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP_NAME }}" \
            --image "${{ steps.api_image.outputs.value }}" \
            --set-env-vars "${ENV_VARS[@]}" \
            --remove-env-vars AZURE_SQL_CONNECTIONSTRING RUN_MIGRATIONS \
            --no-wait \
            --output none

      - name: Wait for revision to be running
        run: |
          APP_FQDN=$(az containerapp show \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Waking app at https://${APP_FQDN}..."
          curl -s --max-time 15 -o /dev/null "https://${APP_FQDN}/actuator/health" || true
          echo "Waiting for new revision to become active..."
          for i in $(seq 1 30); do
            STATUS=$(az containerapp revision list \
              --name ${{ vars.CONTAINER_APP_NAME }} \
              --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
              --query "sort_by([], &properties.createdTime)[-1].properties.runningState" -o tsv 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "Running" ] || [ "$STATUS" = "RunningAtMaxScale" ]; then
              echo "Revision is running ($STATUS)."
              break
            fi
            if [ "$STATUS" = "ActivationFailed" ]; then
              echo "Revision activation failed — app crashed on startup. Check Container App logs in the Azure Portal." >&2
              exit 1
            fi
            echo "  Status: $STATUS (attempt $i/30)"
            curl -s --max-time 15 -o /dev/null "https://${APP_FQDN}/actuator/health" || true
            sleep 10
          done

      - name: Verify deployment health
        run: |
          APP_FQDN=$(az containerapp show \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Polling https://${APP_FQDN}/actuator/health ..."
          for i in $(seq 1 20); do
            HTTP_STATUS=$(curl -s --max-time 15 -o /tmp/health.json -w "%{http_code}" "https://${APP_FQDN}/actuator/health" || echo "000")
            HEALTH_STATUS=$(jq -r '.status' /tmp/health.json 2>/dev/null || echo "unknown")
            echo "  HTTP $HTTP_STATUS, status: $HEALTH_STATUS (attempt $i/20)"
            if [ "$HTTP_STATUS" = "200" ] && [ "$HEALTH_STATUS" = "UP" ]; then
              echo "Deployment is healthy."
              break
            fi
            if [ "$i" = "20" ]; then
              echo "Health check failed after 20 attempts." >&2
              cat /tmp/health.json >&2
              exit 1
            fi
            sleep 10
          done

      # The "disable migration" step is gone: creating a table that already exists is
      # idempotent, so every replica can safely bootstrap on every boot.
