name: Release to prod

on:
  release:
    types: [published]
  # Rollback path: re-run this workflow against an earlier tag to put that release's
  # already-tested artefacts back in prod, rather than hand-deploying a package.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v1.4.2). Defaults to the latest release.
        required: false
        type: string

# Two releases published close together must not deploy at once, or the older one can finish
# last and win. cancel-in-progress: false protects the run that is already deploying — a
# half-finished prod deploy is worse than a queued one. It does not promise every run
# executes: GitHub holds a single pending run per group, so a third one entering while one
# deploys and one waits drops the waiting run. A rollback dispatch can be displaced that way,
# so check that it actually ran rather than assuming it is queued.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  release-prod:
    environment: prod

    # A release runs from its own tag; a manual rollback only from main. The job checks out
    # the ref it runs for and executes composite actions from it, so dispatching from an
    # arbitrary branch would run that branch's code beside the prod credentials. Which tag is
    # deployed is the `tag` input, not the ref, so restricting this costs the rollback path
    # nothing. (Deployment branch policies on the prod environment are the durable fix; this
    # condition is what the workflow itself can enforce.)
    if: >-
      ${{ (github.event_name == 'release' && startsWith(github.ref_name, 'v'))
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [ "${EVENT_NAME}" = "release" ]; then
            TAG="${RELEASE_TAG}"
          else
            TAG=$(gh release view --json tagName --jq .tagName)
          fi
          # The tag reaches later steps through the environment, never interpolated into a
          # script, and must look like a release tag before it goes anywhere near a command.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing to deploy '$TAG': expected a tag of the form v1.2.3." >&2
            exit 1
          fi
          echo "Deploying release ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Both artefacts are the ones staging built and ran, not a rebuild of the same commit.
      - name: Download release artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --pattern 'ui-dist.zip' --pattern 'func-package.zip' --clobber
          unzip -q ui-dist.zip

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The API goes first and must pass its health check before the site is switched over.
      # The other order puts a new UI in front of an API that may never come up, with no way
      # back but another deploy; this way a failed API leaves prod entirely on the old release.
      - name: Deploy API to prod
        uses: ./.github/actions/deploy-function-app
        with:
          package-path: func-package.zip
          storage-account-name: ${{ vars.STORAGE_ACCOUNT_NAME }}
          deployment-container-name: ${{ vars.DEPLOYMENT_CONTAINER_NAME }}
          resource-group-name: ${{ vars.RESOURCE_GROUP_NAME }}
          function-app-name: ${{ vars.FUNCTION_APP_NAME }}
          health-url: ${{ vars.FUNCTION_APP_URL }}

      - name: Configure UI (prod)
        uses: ./.github/actions/configure-ui-runtime-config
        with:
          config-file: ./ui-dist/config.js
          api-url: ${{ vars.API_URL }}
          application-id-uri: ${{ vars.ENTRA_APPLICATION_ID_URI }}
          client-id: ${{ vars.ENTRA_CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          faro-url: ${{ vars.GRAFANA_FARO_URL }}
          environment: prod

      - name: Deploy UI to prod
        id: builddeploy-prod
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN}}"
          action: "upload"
          app_location: "ui-dist"
          skip_app_build: true
          skip_api_build: true

      # The "disable migration" step is gone: creating a table that already exists is
      # idempotent, so every replica can safely bootstrap on every boot.
