# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:  
  
  build-prep:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: none
    outputs:
      app_version: ${{ steps.app_version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate bot token
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'sinclapa-bot' && !contains(github.event.head_commit.message, '[skip ci]') }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN secret is missing. Add it in repository Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Bump and tag version
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'sinclapa-bot' && !contains(github.event.head_commit.message, '[skip ci]') }}
        uses: ./.github/actions/bump-and-tag-version
        with:
          bot-token: ${{ secrets.BOT_TOKEN }}
          commit-message: ${{ github.event.head_commit.message }}

      - name: Read Version
        id: app_version
        uses: ./.github/actions/read-semver-from-git-tags

  build-api:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      packages: write

    environment: none

    runs-on: ubuntu-latest

    needs: build-prep

    defaults:
      run:
        working-directory: ./src/api

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore API dependencies
        run: dotnet restore ccDiary.sln

      - name: Install dotnet-coverage, reportgenerator and sonarscanner
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet tool install --global dotnet-reportgenerator-globaltool
          dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud - Begin API scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"${{ vars.SONAR_API_PROJECT_KEY }}"
          /o:"${{ vars.SONAR_ORGANIZATION }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"
          /d:sonar.exclusions="**/Migrations/**"
          /d:sonar.coverage.exclusions="**/Migrations/**"
          /d:sonar.qualitygate.wait=true

      - name: Build API
        run: dotnet build ccDiary.sln --no-incremental --configuration Release --no-restore /p:Version=${{ needs.build-prep.outputs.app_version }}

      - name: Test API
        run: dotnet-coverage collect "dotnet test ccDiary.sln --configuration Release --no-build --verbosity normal --logger trx" -f xml -o coverage.xml

      - name: SonarCloud - End API scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.16.1
        if: always()
        with:
          check_name: "API Tests"
          trx_files: "${{ github.workspace }}/src/api/**/*.trx"
          
      - name: Upload Test Result Files
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: ${{ github.workspace }}/**/TestResults/**/*
          retention-days: 5

      - name: Upload Coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: ${{ github.workspace }}/src/api/coverage.xml
          retention-days: 5

      - name: Generate API Coverage Report
        run: reportgenerator -reports:coverage.xml -targetdir:coverage-out -reporttypes:"Cobertura;MarkdownSummaryGithub" "-assemblyfilters:+ccDiaryApi.dll" "-filefilters:-*Migrations*" "-title:API Code Coverage"

      - name: API Coverage Badge
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: src/api/coverage-out/Cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: file
          thresholds: '80 90'

      - name: Combine API coverage badge and detail
        run: |
          { echo "## API Code Coverage"; echo ""; cat "$GITHUB_WORKSPACE/code-coverage-results.md"; echo ""; cat "$GITHUB_WORKSPACE/src/api/coverage-out/SummaryGithub.md"; } > /tmp/api-coverage.md

      - name: Post API Coverage Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          header: api-coverage
          path: /tmp/api-coverage.md

      - name: Publish api
        run: dotnet publish ccDiaryApi/ccDiaryApi.csproj --no-build -c Release -o ./publish
  
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: image_tag
        shell: bash
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository }}-api:${{ needs.build-prep.outputs.app_version }}"
          IMAGE_TAG="$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "value=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          push: true
          context: ./src/api # <== This is the path to the 'api' subdirectory containing your application resources
          file: ./src/api/Dockerfile # <== This specifies the 'Dockerfile' in the subdirectory
          tags: |
             ${{ steps.image_tag.outputs.value }}

    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}

  deploy-api:
    environment: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}

    needs: build-api

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.export_image_tag.outputs.value }}

    env:
      IMAGE_TAG: ${{ needs['build-api'].outputs.image_tag }}

    permissions:
      contents: read

    steps:
      - name: Export image tag
        id: export_image_tag
        run: echo "value=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy GHCR image to Container App with migration
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --image ${{ env.IMAGE_TAG }} \
            --set-env-vars "RUN_MIGRATIONS=true" "OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}" "OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}" "OTEL_SERVICE_NAME=ccDiaryApi" \
            --output none

      - name: Wait for revision to be running
        run: |
          APP_FQDN=$(az containerapp show \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Waking app at https://${APP_FQDN}..."
          curl -s -o /dev/null "https://${APP_FQDN}/actuator/health" || true
          echo "Waiting for new revision to become active..."
          for i in $(seq 1 30); do
            STATUS=$(az containerapp revision list \
              --name ${{ vars.CONTAINER_APP_NAME }} \
              --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
              --query "[0].properties.runningState" -o tsv 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "Running" ] || [ "$STATUS" = "RunningAtMaxScale" ]; then
              echo "Revision is running ($STATUS)."
              break
            fi
            echo "  Status: $STATUS (attempt $i/30)"
            curl -s -o /dev/null "https://${APP_FQDN}/actuator/health" || true
            sleep 10
          done

      - name: Disable migration for subsequent restarts
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --set-env-vars "RUN_MIGRATIONS=false" \
            --output none

      - name: Get Container App URL
        run: |
          APP_URL=$(az containerapp show \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --query 'properties.configuration.ingress.fqdn' \
            --output tsv)
          echo "Container App deployed successfully!"
          echo "App URL: https://${APP_URL}"

  build-ui:
    runs-on: ubuntu-latest

    needs: build-prep

    environment: none

    permissions:
      contents: read
      pull-requests: write
      checks: write

    defaults:
      run:
        working-directory: ./src/ui

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "./src/ui/package-lock.json"

      - name: Install packages
        run: npm ci
          
      - name: Set UI version
        run: npm version "${{ needs.build-prep.outputs.app_version }}" --no-git-tag-version

      - name: Build UI
        run: npm run build --if-present

      - name: Run UI Tests
        run: npm run test:ci

      - name: Upload Test Result Files
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: "${{ github.workspace }}/**/reports/junit.xml"
          retention-days: 5

      - name: Publish UI Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.16.1
        if: always()
        with:
          check_name: "UI Tests"
          files: "${{ github.workspace }}/**/reports/junit.xml"

      - name: UI Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: src/ui/coverage/cobertura-coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: file
          thresholds: '80 90'

      - name: Add UI heading to coverage report
        run: |
          { echo "## UI Code Coverage"; echo ""; cat "$GITHUB_WORKSPACE/code-coverage-results.md"; } > /tmp/coverage-tmp.md
          mv /tmp/coverage-tmp.md "$GITHUB_WORKSPACE/code-coverage-results.md"

      - name: Post UI Coverage Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          header: ui-coverage
          path: code-coverage-results.md

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: "${{ github.workspace }}/src/ui/coverage/lcov.info"
          retention-days: 5

      - name: Store UI
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: "${{ github.workspace }}/src/ui/dist"
          retention-days: 5

      - name: SonarCloud Scan (UI)
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_UI_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

  scan-infra:
    runs-on: ubuntu-latest
    environment: none
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: SonarCloud Scan (Infra)
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dproject.settings=sonar-project-infra.properties
            -Dsonar.projectKey=${{ vars.SONAR_INFRA_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

  deploy-ui:
    environment: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}

    needs: build-ui

    runs-on: ubuntu-latest

    outputs:
      static_web_app_url: ${{ steps.deploy_ui_to_azure.outputs.static_web_app_url }}

    permissions:
      contents: read
      issues: write

    defaults:
      run:
        working-directory: ./src/ui

    steps:
      - name: Download UI Artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: "${{ github.workspace }}/src/ui/dist"

      - name: "Configure UI"
        env:
          VITE_API: ${{ secrets.API_URL }}
          VITE_APPLICATION_ID_URI: ${{ secrets.ENTRA_APPLICATION_ID_URI }}
          VITE_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          VITE_TENANT_ID: ${{ secrets.TENANT_ID }}
          VITE_FARO_URL: ${{ secrets.GRAFANA_FARO_URL }}
          VITE_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const file = './dist/config.js';
          let content = fs.readFileSync(file, 'utf8');
          const keys = ['VITE_API', 'VITE_APPLICATION_ID_URI', 'VITE_CLIENT_ID', 'VITE_TENANT_ID', 'VITE_FARO_URL', 'VITE_ENVIRONMENT'];
          for (const key of keys) {
            const raw = process.env[key] || '';
            const escaped = raw.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
            content = content.replace(new RegExp(`(${key}:\\s*)"[^"]*"`), (_, prefix) => `${prefix}"${escaped}"`);
          }
          fs.writeFileSync(file, content);
          SCRIPT

      - name: Deploy UI
        id: deploy_ui_to_azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}"
          #repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          #skip_deploy_on_missing_secrets: true
          app_location: "${{ github.workspace }}/src/ui/dist" # App source code path
          skip_app_build: true # Set to true to bypass build step
          skip_api_build: true # Set to true to bypass API build step
          deployment_environment: ${{ github.event.pull_request.number }}
          ###### End of Repository/Build Configurations ######
      - name: Install jq
        if: github.event_name == 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Add Entra SPA redirect URI for Preview
        if: github.event_name == 'pull_request'
        id: add-entra-redirect
        env:
          AZURE_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.TENANT_ID_DEV }}
          ENTRA_APP_OBJECT_ID: ${{ secrets.ENTRA_APP_OBJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try common outputs from the static web apps deploy action
          PREVIEW_URL="${{ steps.deploy_ui_to_azure.outputs.static_web_app_url || steps.deploy_ui_to_azure.outputs.static_site_url || '' }}"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Warning: preview URL was not available from action outputs. Trying to use the Static Web Apps default preview hostname pattern."
            PREVIEW_URL="https://${{ github.head_ref }}-${{ github.repository_owner }}.azurestaticapps.net"
          fi

          echo "Using preview URL: $PREVIEW_URL"

          # Acquire Microsoft Graph token using client credentials
          TOKEN=$(curl -s -X POST \
            -d "client_id=$AZURE_CLIENT_ID&scope=https://graph.microsoft.com/.default&client_secret=$AZURE_CLIENT_SECRET&grant_type=client_credentials" \
            "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token" | jq -r .access_token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to acquire token" >&2
            exit 1
          fi

          # Read current spa.redirectUris for the app registration
          CURRENT=$(curl -s -H "Authorization: Bearer $TOKEN" "https://graph.microsoft.com/v1.0/applications/$ENTRA_APP_OBJECT_ID")
          URIS_JSON=$(echo "$CURRENT" | jq '.spa.redirectUris // []')

          # If the preview URL already exists, do nothing
          EXISTS=$(echo "$URIS_JSON" | jq --arg url "$PREVIEW_URL" 'index($url) != null')
          if [ "$EXISTS" = "true" ]; then
            echo "Redirect URI already present"
          else
            UPDATED=$(echo "$URIS_JSON" | jq --arg url "$PREVIEW_URL" '. + [$url]')
            # Patch application with the new redirect URI list
            PATCH_BODY=$(jq -n --argjson arr "$UPDATED" '{spa: {redirectUris: $arr}}')
            curl -s -X PATCH \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PATCH_BODY" \
              "https://graph.microsoft.com/v1.0/applications/$ENTRA_APP_OBJECT_ID"
            # Post a PR comment containing the added redirect so the cleanup workflow can find it later
            PR_NUMBER=${{ github.event.pull_request.number }}
            COMMENTS_API="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments"
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d "{\"body\": \"ENTRA_PREVIEW_REDIRECT: $PREVIEW_URL\"}" "$COMMENTS_API"
            echo "Added redirect URI and left PR comment."
          fi

  e2e-tests:
    environment: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}

    needs: [deploy-api, deploy-ui]

    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./src/ui

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "./src/ui/package-lock.json"

      - name: Install packages
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Container App API URL
        id: api_url
        run: |
          APP_FQDN=$(az containerapp show \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "value=https://${APP_FQDN}" >> $GITHUB_OUTPUT

      - name: Get API bearer token
        id: api_token
        env:
          AZURE_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.TENANT_ID }}
          ENTRA_APPLICATION_ID_URI: ${{ secrets.ENTRA_APPLICATION_ID_URI }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -d "client_id=$AZURE_CLIENT_ID&scope=${ENTRA_APPLICATION_ID_URI}/.default&client_secret=$AZURE_CLIENT_SECRET&grant_type=client_credentials" \
            "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token")
          TOKEN=$(echo "$RESPONSE" | jq -r .access_token 2>/dev/null)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to acquire API token"
            echo "Azure AD raw response: $RESPONSE"
            exit 1
          fi
          echo "value=${TOKEN}" >> $GITHUB_OUTPUT

      - name: Wait for API to be ready
        run: |
          API_URL="${{ steps.api_url.outputs.value }}"
          echo "Waiting for API at ${API_URL}/actuator/health ..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/actuator/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API is ready (attempt $i)."
              break
            fi
            echo "  HTTP $STATUS — retrying in 10s (attempt $i/20)..."
            sleep 10
          done

      - name: Seed test data
        working-directory: ./
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/seed_response.json -w "%{http_code}" -X POST \
            "${{ steps.api_url.outputs.value }}/api/v1/DiaryArchive/Import" \
            -H "Authorization: Bearer ${{ steps.api_token.outputs.value }}" \
            -H "Content-Type: application/json" \
            -d @data/test_data.json)
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/seed_response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Seeding failed with HTTP $HTTP_STATUS" >&2
            exit 1
          fi
          echo "Test data seeded."

    #   - name: Run E2E Tests
    #     env:
    #       PLAYWRIGHT_API_URL: ${{ steps.api_url.outputs.value }}
    #       PLAYWRIGHT_BASE_URL: ${{ needs.deploy-ui.outputs.static_web_app_url }}
    #     run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ${{ github.workspace }}/src/ui/playwright-report/
          retention-days: 5

  create-release:
    name: Create Release

    environment: none

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    needs: [build-prep, deploy-ui, deploy-api]

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist

      - name: Zip Artifact
        run: |
          zip -r ui-dist.zip ui-dist

      - name: Write API image tag asset
        run: |
          echo "${{ needs.deploy-api.outputs.image_tag }}" > api-image.txt

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build-prep.outputs.app_version }}
          name: Release ${{ needs.build-prep.outputs.app_version }}
          body: |
            ## Info
            Commit ${{ github.sha }} was deployed to `staging`. [See code diff](${{ github.event.compare }}).

            It was initialized by [${{ github.event.sender.login }}](${{ github.event.sender.html_url }}).

            ## How to Promote?
            In order to promote this to prod, edit the draft and press **"Publish release"**.
          draft: true
          files: |
            ui-dist.zip
            api-image.txt
