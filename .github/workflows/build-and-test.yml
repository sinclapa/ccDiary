# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  
  build-prep:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: none
    outputs:
      app_version: ${{ steps.app_version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate bot token
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'sinclapa-bot' && !contains(github.event.head_commit.message, '[skip ci]') }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN secret is missing. Add it in repository Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Bump and tag version
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'sinclapa-bot' && !contains(github.event.head_commit.message, '[skip ci]') }}
        uses: ./.github/actions/bump-and-tag-version
        with:
          bot-token: ${{ secrets.BOT_TOKEN }}
          commit-message: ${{ github.event.head_commit.message }}

      - name: Read Version
        id: app_version
        uses: ./.github/actions/read-semver-from-git-tags

  build-api:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      packages: write

    environment: none

    runs-on: ubuntu-latest

    needs: build-prep

    # Azurite backs the storage-layer tests. They run against the real emulator rather
    # than a hand-written fake, because the behaviours worth testing — row key ordering,
    # filter evaluation, the 100-entity transaction limit, 404/409 semantics — are
    # exactly the ones a fake would get wrong.
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    defaults:
      run:
        working-directory: ./src/api

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore API dependencies
        run: dotnet restore ccDiary.sln

      - name: Install dotnet-coverage, reportgenerator and sonarscanner
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet tool install --global dotnet-reportgenerator-globaltool
          dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud - Begin API scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"${{ vars.SONAR_API_PROJECT_KEY }}"
          /o:"${{ vars.SONAR_ORGANIZATION }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"
          /d:sonar.exclusions="**/Migrations/**"
          /d:sonar.coverage.exclusions="**/Migrations/**"
          /d:sonar.qualitygate.wait=true

      - name: Build API
        run: dotnet build ccDiary.sln --no-incremental --configuration Release --no-restore /p:Version=${{ needs.build-prep.outputs.app_version }}

      # The Azurite image is Node-based and ships no curl or nc, so a container-level
      # healthcheck is awkward; wait on the table endpoint from the runner instead.
      - name: Wait for Azurite
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/10002) 2>/dev/null; then
              echo "Azurite is up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Azurite did not become reachable on 127.0.0.1:10002 within 30s"
          exit 1

      - name: Test API
        run: dotnet-coverage collect "dotnet test ccDiary.sln --configuration Release --no-build --verbosity normal --logger trx" -f xml -o coverage.xml

      - name: SonarCloud - End API scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.16.1
        if: always()
        with:
          check_name: "API Tests"
          trx_files: "${{ github.workspace }}/src/api/**/*.trx"
          
      - name: Upload Test Result Files
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: ${{ github.workspace }}/**/TestResults/**/*
          retention-days: 5

      - name: Upload Coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: ${{ github.workspace }}/src/api/coverage.xml
          retention-days: 5

      - name: Generate API Coverage Report
        run: reportgenerator -reports:coverage.xml -targetdir:coverage-out -reporttypes:"Cobertura;MarkdownSummaryGithub" "-assemblyfilters:+ccDiaryApi.dll" "-filefilters:-*Migrations*" "-title:API Code Coverage"

      - name: API Coverage Badge
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: src/api/coverage-out/Cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: file
          thresholds: '80 90'

      - name: Combine API coverage badge and detail
        run: |
          { echo "## API Code Coverage"; echo ""; cat "$GITHUB_WORKSPACE/code-coverage-results.md"; echo ""; cat "$GITHUB_WORKSPACE/src/api/coverage-out/SummaryGithub.md"; } > /tmp/api-coverage.md

      - name: Post API Coverage Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          header: api-coverage
          path: /tmp/api-coverage.md

      # The Flex Consumption package: the same application, published self-contained because
      # the custom-handler worker is not guaranteed to carry a .NET runtime, and zipped here
      # on Linux so ccDiaryApi and run.sh keep their executable bit — a zip built on Windows
      # loses it and the host then cannot start the handler.
      - name: Package api as a Functions custom handler
        run: |
          dotnet publish ccDiaryApi/ccDiaryApi.csproj -c Release -r linux-x64 --self-contained true \
            -o ./func-publish -p:Version=${{ needs.build-prep.outputs.app_version }}
          chmod +x ./func-publish/ccDiaryApi ./func-publish/run.sh
          (cd ./func-publish && zip -qr ../func-package.zip .)

      - name: Upload Functions package
        uses: actions/upload-artifact@v4
        with:
          name: api-func-package
          path: ${{ github.workspace }}/src/api/func-package.zip
          retention-days: 5

  build-ui:
    runs-on: ubuntu-latest

    needs: build-prep

    environment: none

    permissions:
      contents: read
      pull-requests: write
      checks: write

    defaults:
      run:
        working-directory: ./src/ui

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "./src/ui/package-lock.json"

      - name: Install packages
        run: npm ci
          
      - name: Set UI version
        run: npm version "${{ needs.build-prep.outputs.app_version }}" --no-git-tag-version

      - name: Build UI
        run: npm run build --if-present

      - name: Run UI Tests
        run: npm run test:ci

      - name: Upload Test Result Files
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: "${{ github.workspace }}/**/reports/junit.xml"
          retention-days: 5

      - name: Publish UI Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.16.1
        if: always()
        with:
          check_name: "UI Tests"
          files: "${{ github.workspace }}/**/reports/junit.xml"

      - name: UI Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: src/ui/coverage/cobertura-coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: file
          thresholds: '80 90'

      - name: Add UI heading to coverage report
        run: |
          { echo "## UI Code Coverage"; echo ""; cat "$GITHUB_WORKSPACE/code-coverage-results.md"; } > /tmp/coverage-tmp.md
          mv /tmp/coverage-tmp.md "$GITHUB_WORKSPACE/code-coverage-results.md"

      - name: Post UI Coverage Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          header: ui-coverage
          path: code-coverage-results.md

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: "${{ github.workspace }}/src/ui/coverage/lcov.info"
          retention-days: 5

      - name: Store UI
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: "${{ github.workspace }}/src/ui/dist"
          retention-days: 5

      - name: SonarCloud Scan (UI)
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_UI_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

  scan-infra:
    runs-on: ubuntu-latest
    environment: none
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: SonarCloud Scan (Infra)
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dproject.settings=sonar-project-infra.properties
            -Dsonar.projectKey=${{ vars.SONAR_INFRA_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

  # One job deploys this environment and verifies it, in that order: API, then UI, then the
  # end-to-end run. The API goes first everywhere for the reason it goes first in prod — the
  # site is what points traffic at a version, so switching it last means a failed API deploy
  # leaves the environment on the previous one rather than stranding a new UI in front of it.
  #
  # They are one job rather than three because every pull request deploys to the single dev
  # function app: a concurrency group spanning separate jobs releases the lock between them
  # and lets the next run deploy in the gap, leaving the tests to exercise someone else's
  # API. One job holds it throughout. (GitHub still keeps only one run pending per group, so
  # a third concurrent run is cancelled rather than queued behind the second.)
  deploy-and-verify:
    environment: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}

    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}
      cancel-in-progress: false

    needs: [build-api, build-ui]

    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
      # Lets the job mint the short-lived OIDC token Entra exchanges for an Azure one, so no
      # Azure credential is stored in GitHub at all.
      id-token: write

    defaults:
      run:
        working-directory: ./src/ui

    steps:
      - uses: actions/checkout@v5

      # Federated (OIDC) sign-in: this run proves its identity to Entra with a token GitHub
      # mints for it, scoped to this repository and environment, instead of presenting a
      # stored client secret. buildInfrastructure.ps1 registers the matching federated
      # credential on each environment's app registration.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download Functions package
        uses: actions/download-artifact@v4
        with:
          name: api-func-package
          path: ${{ github.workspace }}/func-package

      - name: Deploy package to Function App
        uses: ./.github/actions/deploy-function-app
        with:
          package-path: ${{ github.workspace }}/func-package/func-package.zip
          storage-account-name: ${{ vars.STORAGE_ACCOUNT_NAME }}
          deployment-container-name: ${{ vars.DEPLOYMENT_CONTAINER_NAME }}
          resource-group-name: ${{ vars.RESOURCE_GROUP_NAME }}
          function-app-name: ${{ vars.FUNCTION_APP_NAME }}
          health-url: ${{ vars.FUNCTION_APP_URL }}

      - name: Report API URL
        run: echo "API deployed to ${{ vars.FUNCTION_APP_URL }}"

      - name: Download UI Artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: "${{ github.workspace }}/src/ui/dist"

      - name: "Configure UI"
        uses: ./.github/actions/configure-ui-runtime-config
        with:
          config-file: ${{ github.workspace }}/src/ui/dist/config.js
          api-url: ${{ vars.API_URL }}
          application-id-uri: ${{ vars.ENTRA_APPLICATION_ID_URI }}
          client-id: ${{ vars.ENTRA_CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          faro-url: ${{ vars.GRAFANA_FARO_URL }}
          environment: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}

      - name: Deploy UI
        id: deploy_ui_to_azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}"
          #repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          #skip_deploy_on_missing_secrets: true
          app_location: "${{ github.workspace }}/src/ui/dist" # App source code path
          skip_app_build: true # Set to true to bypass build step
          skip_api_build: true # Set to true to bypass API build step
          deployment_environment: ${{ github.event.pull_request.number }}
          ###### End of Repository/Build Configurations ######
      - name: Get a Graph token
        if: github.event_name == 'pull_request'
        id: graph_token
        uses: ./.github/actions/entra-token
        with:
          client-id: ${{ vars.ENTRA_CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          scope: https://graph.microsoft.com/.default

      - name: Add Entra SPA redirect URI for Preview
        if: github.event_name == 'pull_request'
        id: add-entra-redirect
        env:
          GRAPH_TOKEN: ${{ steps.graph_token.outputs.token }}
          ENTRA_APP_OBJECT_ID: ${{ vars.ENTRA_APP_OBJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A branch name is attacker-controlled text, so it reaches the script as data
          # rather than as something the shell expands.
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          DEPLOY_PREVIEW_URL: ${{ steps.deploy_ui_to_azure.outputs.static_web_app_url || steps.deploy_ui_to_azure.outputs.static_site_url || '' }}
        run: |
          # Try common outputs from the static web apps deploy action
          PREVIEW_URL="$DEPLOY_PREVIEW_URL"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Warning: preview URL was not available from action outputs. Trying to use the Static Web Apps default preview hostname pattern."
            PREVIEW_URL="https://${HEAD_REF}-${REPOSITORY_OWNER}.azurestaticapps.net"
          fi

          echo "Using preview URL: $PREVIEW_URL"

          TOKEN="$GRAPH_TOKEN"

          # Read current spa.redirectUris for the app registration
          CURRENT=$(curl -s -H "Authorization: Bearer $TOKEN" "https://graph.microsoft.com/v1.0/applications/$ENTRA_APP_OBJECT_ID")
          URIS_JSON=$(echo "$CURRENT" | jq '.spa.redirectUris // []')

          # If the preview URL already exists, do nothing
          EXISTS=$(echo "$URIS_JSON" | jq --arg url "$PREVIEW_URL" 'index($url) != null')
          if [ "$EXISTS" = "true" ]; then
            echo "Redirect URI already present"
          else
            UPDATED=$(echo "$URIS_JSON" | jq --arg url "$PREVIEW_URL" '. + [$url]')
            # Patch application with the new redirect URI list
            PATCH_BODY=$(jq -n --argjson arr "$UPDATED" '{spa: {redirectUris: $arr}}')
            curl -s -X PATCH \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PATCH_BODY" \
              "https://graph.microsoft.com/v1.0/applications/$ENTRA_APP_OBJECT_ID"
            # Post a PR comment containing the added redirect so the cleanup workflow can find it later
            PR_NUMBER=${{ github.event.pull_request.number }}
            COMMENTS_API="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments"
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d "{\"body\": \"ENTRA_PREVIEW_REDIRECT: $PREVIEW_URL\"}" "$COMMENTS_API"
            echo "Added redirect URI and left PR comment."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "./src/ui/package-lock.json"

      - name: Install packages
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('src/ui/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The function app is what the UI calls, so it is what the end-to-end run exercises.
      - name: Get API URL
        id: api_url
        run: echo "value=${{ vars.FUNCTION_APP_URL }}" >> $GITHUB_OUTPUT

      # The seeding call below needs a token for the API's own audience, which the app
      # registration issues to itself — federated, so CI holds no client secret for it.
      - name: Get API bearer token
        id: api_token
        uses: ./.github/actions/entra-token
        with:
          client-id: ${{ vars.ENTRA_CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          scope: ${{ vars.ENTRA_APPLICATION_ID_URI }}/.default

      # No wait for the API here: the deploy step above already polled it to healthy, and
      # nothing else can have deployed over it while this job holds the lock.
      - name: Seed test data
        working-directory: ./
        env:
          API_TOKEN: ${{ steps.api_token.outputs.token }}
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/seed_response.json -w "%{http_code}" -X POST \
            "${{ steps.api_url.outputs.value }}/api/v1/DiaryArchive/Import" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @data/test_data.json)
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/seed_response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Seeding failed with HTTP $HTTP_STATUS" >&2
            exit 1
          fi
          echo "Test data seeded."

      - name: Run E2E Tests
        env:
          PLAYWRIGHT_API_URL: ${{ steps.api_url.outputs.value }}
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy_ui_to_azure.outputs.static_web_app_url }}
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ${{ github.workspace }}/src/ui/playwright-report/
          retention-days: 5

      - name: Publish E2E Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.16.1
        if: always()
        with:
          check_name: "E2E Tests"
          files: "${{ github.workspace }}/src/ui/playwright-report/junit.xml"

  create-release:
    name: create-release

    environment: none

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    needs: [build-prep, deploy-and-verify]

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist

      # The prod release deploys exactly what staging ran, so the Functions package travels
      # with the release rather than being rebuilt when the release is published.
      - name: Download Functions package
        uses: actions/download-artifact@v4
        with:
          name: api-func-package
          path: func-package

      - name: Zip Artifact
        run: |
          zip -r ui-dist.zip ui-dist

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-prep.outputs.app_version }}
          name: Release ${{ needs.build-prep.outputs.app_version }}
          body: |
            ## Info
            Commit ${{ github.sha }} was deployed to `staging`. [See code diff](${{ github.event.compare }}).

            It was initialized by [${{ github.event.sender.login }}](${{ github.event.sender.html_url }}).

            ## How to Promote?
            In order to promote this to prod, edit the draft and press **"Publish release"**.
          draft: true
          files: |
            ui-dist.zip
            func-package/func-package.zip
