name: Cleanup PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: read
  # Lets the job exchange the run's OIDC token for a Graph token, so removing a preview
  # redirect needs no stored client secret.
  id-token: write

jobs:
  cleanup-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    environment: dev

    steps:
      - uses: actions/checkout@v5

      - name: Find ENTRA preview redirect from PR comments
        id: find-comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          API="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments"
          COMMENTS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$API")
          PREVIEW_URL=$(echo "$COMMENTS" | jq -r '.[] | .body | select(test("ENTRA_PREVIEW_REDIRECT:"))' | tail -n1 | sed -e 's/.*ENTRA_PREVIEW_REDIRECT: *//')
          if [ -z "$PREVIEW_URL" ]; then
            echo "No ENTRA preview redirect comment found; nothing to do."
            echo "preview_url=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Found preview URL: $PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Get a Graph token
        if: steps.find-comment.outputs.preview_url != ''
        id: graph_token
        uses: ./.github/actions/entra-token
        with:
          client-id: ${{ vars.ENTRA_CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          scope: https://graph.microsoft.com/.default

      - name: Remove Entra SPA redirect URI
        if: steps.find-comment.outputs.preview_url != ''
        env:
          TOKEN: ${{ steps.graph_token.outputs.token }}
          ENTRA_APP_OBJECT_ID: ${{ vars.ENTRA_APP_OBJECT_ID }}
          PREVIEW_URL: ${{ steps.find-comment.outputs.preview_url }}
        run: |
          echo "Removing preview URL: $PREVIEW_URL"

          # Get current redirect URIs
          CURRENT=$(curl -s -H "Authorization: Bearer $TOKEN" "https://graph.microsoft.com/v1.0/applications/$ENTRA_APP_OBJECT_ID")
          URIS_JSON=$(echo "$CURRENT" | jq '.spa.redirectUris // []')

          # Remove the preview URL if present
          FILTERED=$(echo "$URIS_JSON" | jq --arg url "$PREVIEW_URL" 'map(select(. != $url))')

          # Patch back the filtered list
          PATCH_BODY=$(jq -n --argjson arr "$FILTERED" '{spa: {redirectUris: $arr}}')
          curl -s -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PATCH_BODY" \
            "https://graph.microsoft.com/v1.0/applications/$ENTRA_APP_OBJECT_ID"
          echo "Removed preview redirect if it existed."

      - name: Close SWA preview environment for PR
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: close
          app_location: "/"
          deployment_environment: ${{ github.event.pull_request.number }}
