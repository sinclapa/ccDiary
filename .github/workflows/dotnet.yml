# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Version On Commit"] #Its the name of an workflow
    types:
      - completed
jobs:
  check-changes:
    runs-on: ubuntu-latest
    # Always run this job, but only check files on push events to main
    outputs:
      only_version_files: ${{ steps.changed-files.outputs.only_changed }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          fetch-depth: 2
      
      - name: Check if only version files changed
        id: changed-files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: tj-actions/changed-files@v45
        with:
          files: |
            VERSION
            src/ui/package.json
            src/ui/package-lock.json

  build-api:
    needs: [check-changes]
    permissions:
      contents: read
      issues: write
      checks: write
      pull-requests: write
      packages: write
      attestations: write
      id-token: write

    environment: none

    runs-on: ubuntu-latest
    if: |
      (github.event_name != 'push' || needs.check-changes.outputs.only_version_files != 'true') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')

    defaults:
      run:
        working-directory: ./src/api

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Read Version
        id: app_version
        shell: bash
        run: |
          BASE_VERSION=$(cat "${{ github.workspace }}/VERSION")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EFFECTIVE_VERSION="${BASE_VERSION}-alpha-${{ github.event.pull_request.number }}"
          else
            EFFECTIVE_VERSION="$BASE_VERSION"
          fi
          echo "value=$EFFECTIVE_VERSION" >> $GITHUB_OUTPUT

      - name: Restore API dependencies
        run: dotnet restore ccDiary.sln

      - name: Build API
        run: dotnet build ccDiary.sln --configuration Release --no-restore /p:Version=${{ steps.app_version.outputs.value }}

      - name: Test API
        run: dotnet test ccDiary.sln --configuration Release --no-build --verbosity normal --logger "trx" /p:Version=${{ steps.app_version.outputs.value }} /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput="TestResults/coverage" /p:ExcludeByFile="**/*Migrations/*.cs"

      - name: Upload Test Result Files
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: ${{ github.workspace }}/**/TestResults/**/*
          retention-days: 5

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.16.1
        if: always()
        with:
          check_name: "API Tests"
          trx_files: "${{ github.workspace }}/src/api/**/*.trx"

      - name: Combine Coverage Reports # This is because one report is produced per project, and we want one result for all of them.
        uses: danielpalme/ReportGenerator-GitHub-Action@5.2.4
        with:
          reports: "./src/api/**/*.cobertura.xml" # REQUIRED # The coverage reports that should be parsed (separated by semicolon). Globbing is supported.
          targetdir: "${{ github.workspace }}" # REQUIRED # The directory where the generated report should be saved.
          reporttypes: "Cobertura" # The output formats and scope (separated by semicolon) Values: Badges, Clover, Cobertura, CsvSummary, Html, Html_Dark, Html_Light, Html_BlueRed, HtmlChart, HtmlInline, HtmlInline_AzurePipelines, HtmlInline_AzurePipelines_Dark, HtmlInline_AzurePipelines_Light, HtmlSummary, JsonSummary, Latex, LatexSummary, lcov, MarkdownSummary, MarkdownSummaryGithub, MarkdownDeltaSummary, MHtml, PngChart, SonarQube, TeamCitySummary, TextSummary, TextDeltaSummary, Xml, XmlSummary
          verbosity: "Info" # The verbosity level of the log messages. Values: Verbose, Info, Warning, Error, Off
          title: "API Code Coverage" # Optional title.
          tag: "${{ github.run_number }}_${{ github.run_id }}" # Optional tag or build version.
          customSettings: "" # Optional custom settings (separated by semicolon). See: https://github.com/danielpalme/ReportGenerator/wiki/Settings.
          toolpath: "reportgeneratortool" # Default directory for installing the dotnet tool.

      - name: Upload Combined Coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: ${{ github.workspace }}/Cobertura.xml
          retention-days: 5
      
      - name: Publish Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "Cobertura.xml"
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: "80 90"
  
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: "API Code Coverage Report"
          recreate: true
          path: code-coverage-results.md
  
      - name: Publish api
        run: dotnet publish ccDiaryApi/ccDiaryApi.csproj --no-build -c Release -o ./publish /p:Version=${{ steps.app_version.outputs.value }}
  
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          push: true
          context: ./src/api # <== This is the path to the 'api' subdirectory containing your application resources
          file: ./src/api/Dockerfile # <== This specifies the 'Dockerfile' in the subdirectory
          tags: |
            ghcr.io/sinclapa/ccdiary-api:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/sinclapa/ccdiary-api:latest' || '' }}

  deploy-api:
    environment: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}
    needs: build-api
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      packages: write
      attestations: write
      id-token: write

    defaults:
      run:
        working-directory: ./src/api

    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy public GHCR image to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ vars.CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.RESOURCE_GROUP_NAME }}
          imageToDeploy: ghcr.io/sinclapa/ccdiary-api:${{ github.sha }}

  build-ui:
    needs: [check-changes]
    runs-on: ubuntu-latest
    if: |
      (github.event_name != 'push' || needs.check-changes.outputs.only_version_files != 'true') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment: none

    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write

    defaults:
      run:
        working-directory: ./src/ui

    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "./src/ui/package-lock.json"
      - name: Read Version
        id: app_version
        shell: bash
        run: |
          BASE_VERSION=$(cat "${{ github.workspace }}/VERSION")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EFFECTIVE_VERSION="${BASE_VERSION}-alpha-${{ github.event.pull_request.number }}"
          else
            EFFECTIVE_VERSION="$BASE_VERSION"
          fi
          echo "value=$EFFECTIVE_VERSION" >> $GITHUB_OUTPUT
      - name: Set UI version
        run: npm version "${{ steps.app_version.outputs.value }}" --no-git-tag-version
      - name: Install packages
        run: npm ci
      - name: Build UI
        run: npm run build --if-present
      - name: Run UI Tests
        run: npm run test:ci
      - name: Upload Test Result Files
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: "${{ github.workspace }}/**/reports/junit.xml"
          retention-days: 5
      - name: Publish UI Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.16.1
        if: always()
        with:
          check_name: "UI Tests"
          files: "${{ github.workspace }}/**/reports/junit.xml"
      - name: Upload Combined Coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: "${{ github.workspace }}/src/ui/coverage/cobertura-coverage.xml"
          retention-days: 5
      - run: cp "${{ github.workspace }}/src/ui/coverage/cobertura-coverage.xml" "${{ github.workspace }}/cobertura-coverage.xml"
      - name: Publish Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "cobertura-coverage.xml"
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: "80 90"
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: "UI Code Coverage Report"
          recreate: true
          path: code-coverage-results.md
      - name: Store UI
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: "${{ github.workspace }}/src/ui/dist"
          retention-days: 5
  deploy-ui:
    environment: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}
    #if: github.event_name == 'pull_request'
    needs: build-ui
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      packages: write
      attestations: write
      id-token: write

    defaults:
      run:
        working-directory: ./src/ui

    steps:
      - name: Download UI Artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: "${{ github.workspace }}/src/ui/dist"
      - name: "Configure UI"
        env:
          VITE_API: ${{ secrets.API_URL }}
          VITE_APPLICATION_ID_URI: ${{ secrets.ENTRA_APPLICATION_ID_URI }}
        run: |
          sed -i "/^[[:space:]]*VITE_APPLICATION_ID_URI:/s|\"[^\"]*\"|\"${VITE_APPLICATION_ID_URI//\"/\\\"}\"|" ./dist/config.js
          sed -i "/^[[:space:]]*VITE_API:/s|\"[^\"]*\"|\"${VITE_API//\"/\\\"}\"|" ./dist/config.js
          sed -i "s/^\(\s*VITE_CLIENT_ID:\s*\"\)[^\"]*\(\"\s*,\)/\1${{ secrets.ENTRA_CLIENT_ID }}\2/" ./dist/config.js
          sed -i "s/^\(\s*VITE_TENANT_ID:\s*\"\)[^\"]*\(\"\s*,\)/\1${{ secrets.TENANT_ID }}\2/" ./dist/config.js
      - name: Deploy UI
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}"
          #repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          #skip_deploy_on_missing_secrets: true
          app_location: "${{ github.workspace }}/src/ui/dist" # App source code path
          skip_app_build: true # Set to true to bypass build step
          skip_api_build: true # Set to true to bypass API build step
          #github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
      - name: Install jq
        if: github.event_name == 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Add Entra SPA redirect URI for Preview
        if: github.event_name == 'pull_request'
        id: add-entra-redirect
        env:
          AZURE_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.TENANT_ID_DEV }}
          ENTRA_APP_OBJECT_ID: ${{ secrets.ENTRA_APP_OBJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try common outputs from the static web apps deploy action
          PREVIEW_URL="${{ steps.builddeploy.outputs.static_web_app_url || steps.builddeploy.outputs.static_site_url || '' }}"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Warning: preview URL was not available from action outputs. Trying to use the Static Web Apps default preview hostname pattern."
            PREVIEW_URL="https://${{ github.head_ref }}-${{ github.repository_owner }}.azurestaticapps.net"
          fi

          echo "Using preview URL: $PREVIEW_URL"

          # Acquire Microsoft Graph token using client credentials
          TOKEN=$(curl -s -X POST \
            -d "client_id=$AZURE_CLIENT_ID&scope=https://graph.microsoft.com/.default&client_secret=$AZURE_CLIENT_SECRET&grant_type=client_credentials" \
            "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token" | jq -r .access_token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to acquire token" >&2
            exit 1
          fi

          # Read current spa.redirectUris for the app registration
          CURRENT=$(curl -s -H "Authorization: Bearer $TOKEN" "https://graph.microsoft.com/v1.0/applications/$ENTRA_APP_OBJECT_ID")
          URIS_JSON=$(echo "$CURRENT" | jq '.spa.redirectUris // []')

          # If the preview URL already exists, do nothing
          EXISTS=$(echo "$URIS_JSON" | jq --arg url "$PREVIEW_URL" 'index($url) != null')
          if [ "$EXISTS" = "true" ]; then
            echo "Redirect URI already present"
          else
            UPDATED=$(echo "$URIS_JSON" | jq --arg url "$PREVIEW_URL" '. + [$url]')
            # Patch application with the new redirect URI list
            PATCH_BODY=$(jq -n --argjson arr "$UPDATED" '{spa: {redirectUris: $arr}}')
            curl -s -X PATCH \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PATCH_BODY" \
              "https://graph.microsoft.com/v1.0/applications/$ENTRA_APP_OBJECT_ID"
            # Post a PR comment containing the added redirect so the cleanup workflow can find it later
            PR_NUMBER=${{ github.event.pull_request.number }}
            COMMENTS_API="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments"
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d "{\"body\": \"ENTRA_PREVIEW_REDIRECT: $PREVIEW_URL\"}" "$COMMENTS_API"
            echo "Added redirect URI and left PR comment."
          fi
  create-release:
    name: Create Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    needs: [build-ui, deploy-ui, build-api, deploy-api]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist
      # we can't attach a folder to a release
      - name: Zip Artifact
        run: |
          zip -r ui-dist.zip ui-dist
      - name: Create Release Tag
        id: create-release-tag
        # left pads the run number with zeros to a length of 4; better alphabetical order
        run: echo "tag_name=r-$(printf %04d $GITHUB_RUN_NUMBER)" >> $GITHUB_OUTPUT
      - name: Tag API Image
        run: |
          docker pull ghcr.io/sinclapa/ccdiary-api:${{ github.sha }}
          docker tag ghcr.io/sinclapa/ccdiary-api:${{ github.sha }} ghcr.io/sinclapa/ccdiary-api:${{ steps.create-release-tag.outputs.tag_name }}
          docker push ghcr.io/sinclapa/ccdiary-api:${{ steps.create-release-tag.outputs.tag_name }}
      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create-release-tag.outputs.tag_name }}
          name: Release ${{ steps.create-release-tag.outputs.tag_name }}
          body: |
            ## Info
            Commit ${{ github.sha }} was deployed to `staging`. [See code diff](${{ github.event.compare }}).

            It was initialized by [${{ github.event.sender.login }}](${{ github.event.sender.html_url }}).

            ## How to Promote?
            In order to promote this to prod, edit the draft and press **"Publish release"**.
          draft: true
          files: ui-dist.zip
