name: Version On Commit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  set-semver:
    if: github.actor != 'sinclapa-bot' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Validate bot token
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN secret is missing. Add it in repository Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Calculate next semantic version (from git tags)
        id: semver
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"

          git fetch --tags --force

          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [ -z "${LATEST_TAG}" ]; then
            CURRENT_VERSION="0.0.0"
          else
            CURRENT_VERSION="${LATEST_TAG#v}"
          fi

          if [[ "$COMMIT_MESSAGE" == *"BREAKING CHANGE"* ]] || [[ "$COMMIT_MESSAGE" =~ ^[a-zA-Z]+\(.*\)!: ]] || [[ "$COMMIT_MESSAGE" =~ ^[a-zA-Z]+!: ]]; then
            BUMP="major"
          elif [[ "$COMMIT_MESSAGE" =~ ^feat\(.*\): ]] || [[ "$COMMIT_MESSAGE" =~ ^feat: ]]; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          NEW_VERSION: ${{ steps.semver.outputs.next_version }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail

          TAG="v${NEW_VERSION}"

          # Avoid failing if tag already exists (e.g., rerun)
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Nothing to do."
            exit 0
          fi

          git config user.name "sinclapa-bot"
          git config user.email "sinclapa-bot@users.noreply.github.com"

          # Lightweight tag; switch to annotated if you want: git tag -a "$TAG" -m "$TAG"
          git tag "$TAG"

          git remote set-url origin "https://x-access-token:${BOT_TOKEN}@github.com/${{ github.repository }}.git"

          if ! TAG_PUSH_OUTPUT=$(git push origin "$TAG" 2>&1); then
            echo "$TAG_PUSH_OUTPUT"
            if echo "$TAG_PUSH_OUTPUT" | grep -q "GH013"; then
              echo "Push blocked by repository rules (GH013). Ensure BOT_TOKEN identity is added as a ruleset bypass for main and required checks policy allows this automation path." >&2
            fi
            exit 1
          fi